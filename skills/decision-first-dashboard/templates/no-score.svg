<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Subscription health</title>
  <desc id="desc">Subscription metrics, revenue context, account exceptions, and recent events.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbfe"/>
      <stop offset="1" stop-color="#f6f7fc"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="52%" cy="43%" r="62%">
      <stop offset="0" stop-color="#efecff" stop-opacity="0.52"/>
      <stop offset="0.48" stop-color="#f7f6ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerField" cx="50%" cy="47%" r="54%">
      <stop offset="0" stop-color="#f0edff" stop-opacity="0.86"/>
      <stop offset="0.56" stop-color="#f7f5ff" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.96"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7768e6"/>
      <stop offset="1" stop-color="#9e91ef"/>
    </linearGradient>
    <marker id="radarVertex" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="5" fill="#6f60e5" stroke="#ffffff" stroke-width="2"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ink { fill: #171733; }
      .muted { fill: #777a9d; }
      .soft { fill: #a0a2bd; }
      .accent { fill: #6758df; }
      .positive { fill: #2f8a67; }
      .danger { fill: #e0525f; }
      .center-field { fill: url(#centerField); stroke: #f0eef9; stroke-width: 1; }
      .radar-guide { fill: none; stroke: #d8d4f5; stroke-width: 1; stroke-dasharray: 6 9; }
      .radar-shape { marker-start: url(#radarVertex); marker-mid: url(#radarVertex); }
      .direction-core { fill: #ffffff; stroke: #ffffff; stroke-width: 10; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#pageBg)"/>
  <rect width="1440" height="900" fill="url(#ambientGlow)"/>

  <g class="sans">
    <text x="72" y="76" class="ink" font-size="29" font-weight="760" letter-spacing="-0.8">Subscription health</text>
    <text x="72" y="107" class="muted" font-size="14">A compact view of movement, exceptions, and business context</text>

    <text x="98" y="194" class="ink" font-size="15" font-weight="700">{{REVENUE_TITLE}}</text>
    <text x="98" y="236" class="ink" font-size="32" font-weight="760">{{REVENUE_VALUE}}</text>
    {{REVENUE_DELTA_BLOCK}}
    {{REVENUE_VISUAL}}
    <line x1="98" y1="392" x2="332" y2="392" stroke="#e8e8f2"/>
    <text x="98" y="422" class="muted" font-size="12">{{CURRENT_REVENUE_LABEL}}</text>
    <text x="332" y="422" class="ink" font-size="13" font-weight="700" text-anchor="end">{{REVENUE_VALUE}}</text>

    <text x="98" y="516" class="ink" font-size="15" font-weight="700">Movement context</text>
    {{MOVEMENT_ROWS}}

    <circle cx="740" cy="458" r="306" class="center-field"/>
    <text x="434" y="208" class="muted" font-size="11" font-weight="700" letter-spacing="1.7">OVERALL DIRECTION</text>

    <circle cx="740" cy="458" r="204" class="radar-guide"/>
    <circle cx="740" cy="458" r="152" class="radar-guide"/>
    <circle cx="740" cy="458" r="100" class="radar-guide"/>

    <g transform="translate(42 -6)">
      {{SVG_ORBIT_VISUAL}}
      {{SVG_SIGNAL_NODES}}
    </g>

    <circle cx="740" cy="458" r="80" class="direction-core"/>
    <circle cx="740" cy="458" r="69" fill="#fbfaff"/>
    <text x="740" y="452" class="accent" font-size="22" font-weight="790" text-anchor="middle">{{SYNTHESIS}}</text>
    <text x="740" y="486" class="muted" font-size="13" text-anchor="middle">Target unknown</text>

    <text x="1064" y="194" class="ink" font-size="15" font-weight="700">Accounts to watch</text>
    {{EXCEPTION_ROWS}}

    <text x="1064" y="496" class="ink" font-size="15" font-weight="700">Recent events</text>
    {{EVENT_ROWS}}
  </g>
</svg>
