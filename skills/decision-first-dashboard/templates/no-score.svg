<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Subscription health</title>
  <desc id="desc">Subscription metrics, revenue context, account exceptions, and recent events.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#f2f4fb"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#eee9ff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f9f8ff" stop-opacity="0.16"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8172d8"/>
      <stop offset="1" stop-color="#a99ce9"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#554d86" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ink { fill: #242338; }
      .muted { fill: #858398; }
      .soft { fill: #aaa7ba; }
      .accent { fill: #7264ca; }
      .positive { fill: #3e8a69; }
      .danger { fill: #b95e69; }
      .card { fill: #ffffff; stroke: #ebe9f5; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#pageBg)"/>

  <g class="sans">
    <text x="72" y="76" class="ink" font-size="28" font-weight="700">Subscription health</text>
    <text x="72" y="106" class="muted" font-size="14">A compact view of movement, exceptions, and business context</text>

    <g filter="url(#cardShadow)">
      <rect x="72" y="150" width="286" height="302" rx="26" class="card"/>
    </g>
    <text x="98" y="190" class="ink" font-size="15" font-weight="650">Revenue growth</text>
    <text x="98" y="228" class="ink" font-size="30" font-weight="720">{{MRR_VALUE}}</text>
    <text x="98" y="252" class="{{MRR_DIRECTION_CLASS}}" font-size="14" font-weight="650">{{MRR_DELTA}}</text>
    <text x="156" y="252" class="muted" font-size="13">vs last month</text>
    {{REVENUE_VISUAL}}
    <line x1="98" y1="392" x2="332" y2="392" stroke="#efedf6"/>
    <text x="98" y="421" class="muted" font-size="12">Current MRR</text>
    <text x="332" y="421" class="ink" font-size="13" font-weight="650" text-anchor="end">{{MRR_VALUE}}</text>

    <g filter="url(#cardShadow)">
      <rect x="72" y="476" width="286" height="190" rx="26" class="card"/>
    </g>
    <text x="98" y="516" class="ink" font-size="15" font-weight="650">Movement context</text>
    {{MOVEMENT_ROWS}}

    <g filter="url(#cardShadow)">
      <rect x="382" y="150" width="632" height="610" rx="34" class="card"/>
    </g>
    <rect x="406" y="174" width="584" height="562" rx="30" fill="url(#centerGlow)"/>
    <text x="414" y="204" class="muted" font-size="12" font-weight="650" letter-spacing="1.5">OVERALL DIRECTION</text>

    <circle cx="698" cy="464" r="188" fill="none" stroke="#e3dff5" stroke-width="1.5" stroke-dasharray="5 8"/>
    <circle cx="698" cy="464" r="132" fill="none" stroke="#ece9f7" stroke-width="1"/>
    <path d="{{SVG_ORBIT_PATHS}}" fill="none" stroke="#d6d0ef" stroke-width="1.6"/>

    <circle cx="698" cy="464" r="94" fill="#ffffff" stroke="#d7d0ef" stroke-width="2"/>
    <circle cx="698" cy="464" r="82" fill="#f7f4ff"/>
    <text x="698" y="458" class="accent" font-size="29" font-weight="760" text-anchor="middle">{{SYNTHESIS}}</text>
    <text x="698" y="490" class="muted" font-size="14" text-anchor="middle">Target unknown</text>

    {{SVG_SIGNAL_NODES}}

    <g filter="url(#cardShadow)">
      <rect x="1038" y="150" width="330" height="278" rx="26" class="card"/>
    </g>
    <text x="1064" y="190" class="ink" font-size="15" font-weight="650">Accounts to watch</text>
    {{EXCEPTION_ROWS}}

    <g filter="url(#cardShadow)">
      <rect x="1038" y="452" width="330" height="308" rx="26" class="card"/>
    </g>
    <text x="1064" y="492" class="ink" font-size="15" font-weight="650">Recent events</text>
    {{EVENT_ROWS}}
  </g>
</svg>
