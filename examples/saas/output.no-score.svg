<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Subscription health</title>
  <desc id="desc">Subscription metrics, revenue context, account exceptions, and recent events.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#f2f4fb"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#eee9ff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f9f8ff" stop-opacity="0.16"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8172d8"/>
      <stop offset="1" stop-color="#a99ce9"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#554d86" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ink { fill: #242338; }
      .muted { fill: #858398; }
      .soft { fill: #aaa7ba; }
      .accent { fill: #7264ca; }
      .positive { fill: #3e8a69; }
      .danger { fill: #b95e69; }
      .card { fill: #ffffff; stroke: #ebe9f5; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#pageBg)"/>

  <g class="sans">
    <text x="72" y="76" class="ink" font-size="28" font-weight="700">Subscription health</text>
    <text x="72" y="106" class="muted" font-size="14">A compact view of movement, exceptions, and business context</text>

    <g filter="url(#cardShadow)">
      <rect x="72" y="150" width="286" height="302" rx="26" class="card"/>
    </g>
    <text x="98" y="190" class="ink" font-size="15" font-weight="650">Revenue growth</text>
    <text x="98" y="228" class="ink" font-size="30" font-weight="720">$184,320</text>
    <text x="98" y="252" class="positive" font-size="14" font-weight="650">+12.4%</text>
    <text x="156" y="252" class="muted" font-size="13">vs last month</text>
    <text x="98" y="330" class="muted" font-size="12">Trend data unavailable</text>
    <line x1="98" y1="392" x2="332" y2="392" stroke="#efedf6"/>
    <text x="98" y="421" class="muted" font-size="12">Current MRR</text>
    <text x="332" y="421" class="ink" font-size="13" font-weight="650" text-anchor="end">$184,320</text>

    <g filter="url(#cardShadow)">
      <rect x="72" y="476" width="286" height="190" rx="26" class="card"/>
    </g>
    <text x="98" y="516" class="ink" font-size="15" font-weight="650">Movement context</text>
    <text x="98" y="558" class="muted" font-size="12">Churn</text>
    <text x="98" y="584" class="ink" font-size="22" font-weight="700">2.84%</text>
    <text x="332" y="582" class="positive" font-size="13" font-weight="650" text-anchor="end">-0.6pp</text>
    <line x1="98" y1="610" x2="332" y2="610" stroke="#efedf6"/>
    <text x="98" y="638" class="muted" font-size="12">Trial conversion</text>
    <text x="332" y="638" class="positive" font-size="13" font-weight="650" text-anchor="end">+3.2%</text>

    <g filter="url(#cardShadow)">
      <rect x="382" y="150" width="632" height="610" rx="34" class="card"/>
    </g>
    <rect x="406" y="174" width="584" height="562" rx="30" fill="url(#centerGlow)"/>
    <text x="414" y="204" class="muted" font-size="12" font-weight="650" letter-spacing="1.5">OVERALL DIRECTION</text>

    <circle cx="698" cy="464" r="188" fill="none" stroke="#e3dff5" stroke-width="1.5" stroke-dasharray="5 8"/>
    <circle cx="698" cy="464" r="132" fill="none" stroke="#ece9f7" stroke-width="1"/>
    <path d="M698 344 L548 388 M698 344 L848 388 M698 584 L548 540 M698 584 L848 540" stroke="#d6d0ef" stroke-width="1.6"/>
    <path d="M548 388 L698 464 L848 388 M548 540 L698 464 L848 540" fill="none" stroke="#c7bfee" stroke-width="2" stroke-opacity="0.7"/>

    <circle cx="698" cy="464" r="94" fill="#ffffff" stroke="#d7d0ef" stroke-width="2"/>
    <circle cx="698" cy="464" r="82" fill="#f7f4ff"/>
    <text x="698" y="458" class="accent" font-size="29" font-weight="760" text-anchor="middle">IMPROVING</text>
    <text x="698" y="490" class="muted" font-size="14" text-anchor="middle">Target unknown</text>

    <circle cx="548" cy="388" r="9" fill="#ffffff" stroke="#8d7fda" stroke-width="3"/>
    <text x="520" y="324" class="accent" font-size="26" font-weight="740" text-anchor="middle">+12.4%</text>
    <text x="520" y="349" class="ink" font-size="13" font-weight="650" text-anchor="middle">MRR</text>
    <text x="520" y="368" class="muted" font-size="11" text-anchor="middle">$184,320</text>

    <circle cx="848" cy="388" r="9" fill="#ffffff" stroke="#8d7fda" stroke-width="3"/>
    <text x="876" y="324" class="accent" font-size="26" font-weight="740" text-anchor="middle">+8.1%</text>
    <text x="876" y="349" class="ink" font-size="13" font-weight="650" text-anchor="middle">Customers</text>
    <text x="876" y="368" class="muted" font-size="11" text-anchor="middle">8,942</text>

    <circle cx="548" cy="540" r="9" fill="#ffffff" stroke="#8d7fda" stroke-width="3"/>
    <text x="520" y="606" class="accent" font-size="26" font-weight="740" text-anchor="middle">-0.6pp</text>
    <text x="520" y="631" class="ink" font-size="13" font-weight="650" text-anchor="middle">Churn</text>
    <text x="520" y="650" class="muted" font-size="11" text-anchor="middle">2.84%</text>

    <circle cx="848" cy="540" r="9" fill="#ffffff" stroke="#8d7fda" stroke-width="3"/>
    <text x="876" y="606" class="accent" font-size="26" font-weight="740" text-anchor="middle">+3.2%</text>
    <text x="876" y="631" class="ink" font-size="13" font-weight="650" text-anchor="middle">Trial conversion</text>
    <text x="876" y="650" class="muted" font-size="11" text-anchor="middle">31.7%</text>

    <g filter="url(#cardShadow)">
      <rect x="1038" y="150" width="330" height="278" rx="26" class="card"/>
    </g>
    <text x="1064" y="190" class="ink" font-size="15" font-weight="650">Accounts to watch</text>
    <g>
      <circle cx="1072" cy="228" r="5" fill="#c96e79"/>
      <text x="1088" y="232" class="ink" font-size="14" font-weight="650">Dovetail</text>
      <text x="1088" y="254" class="muted" font-size="12">Basic · $120 MRR</text>
      <rect x="1268" y="213" width="74" height="26" rx="13" fill="#fff1f3"/>
      <text x="1305" y="231" class="danger" font-size="11" font-weight="650" text-anchor="middle">At risk</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="1038" y="452" width="330" height="308" rx="26" class="card"/>
    </g>
    <text x="1064" y="492" class="ink" font-size="15" font-weight="650">Recent events</text>
    <g>
      <circle cx="1072" cy="530" r="4" fill="#8d7fda"/>
      <text x="1088" y="534" class="ink" font-size="13" font-weight="650">Dovetail</text>
      <text x="1088" y="555" class="muted" font-size="12">Plan cancelled</text>
      <text x="1342" y="555" class="soft" font-size="11" text-anchor="end">1 hr ago</text>
    </g>
<g>
      <circle cx="1072" cy="598" r="4" fill="#8d7fda"/>
      <text x="1088" y="602" class="ink" font-size="13" font-weight="650">Orbit Systems</text>
      <text x="1088" y="623" class="muted" font-size="12">Trial converted</text>
      <text x="1342" y="623" class="soft" font-size="11" text-anchor="end">43 min ago</text>
    </g>
  </g>
</svg>
