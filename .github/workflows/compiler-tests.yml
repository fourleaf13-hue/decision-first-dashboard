name: Compiler tests

on:
  push:
    branches:
      - main
      - feature/dashboard-compiler-mvp
      - feature/composite-mode-compiler
      - feature/v3-evidence-grounding
  pull_request:
    paths:
      - 'skills/decision-first-dashboard/**'
      - 'examples/saas/**'
      - 'examples/radar-profile/**'
      - 'tests/compiler/**'
      - 'scripts/**'
      - 'package.json'
      - 'README.md'
      - '.github/workflows/compiler-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run validate:saas
      - run: npm run render:saas
      - run: npm run validate:radar-showcase
      - run: npm run render:radar-showcase
      - name: Validate SaaSGrid real-world fixture
        run: node skills/decision-first-dashboard/scripts/validate.js examples/saas/real-world/saasgrid/input.no-score.json
      - name: Render SaaSGrid real-world fixture
        run: node skills/decision-first-dashboard/scripts/render.js examples/saas/real-world/saasgrid/input.no-score.json examples/saas/real-world/saasgrid
      - name: Compile grounded composite fixture
        run: node skills/decision-first-dashboard/scripts/compile.js tests/compiler/fixtures/grounding/composite.grounded.json tests/compiler/generated/v3-composite
      - name: Compile grounded no-score fixture
        run: node skills/decision-first-dashboard/scripts/compile.js tests/compiler/fixtures/grounding/no-score.grounded.json tests/compiler/generated/v3-no-score
      - name: Evaluate dashboard worthiness fixture
        run: node skills/decision-first-dashboard/scripts/worthiness.js tests/compiler/fixtures/worthiness/dashboard.worthiness.json
      - name: Compile routed composite fixture
        run: node skills/decision-first-dashboard/scripts/compile-dashboard.js tests/compiler/fixtures/worthiness/dashboard.worthiness.json tests/compiler/fixtures/routing/composite.routing.json tests/compiler/fixtures/grounding/composite.grounded.json tests/compiler/generated/routed-composite
      - name: Compile routed no-score fixture
        run: node skills/decision-first-dashboard/scripts/compile-dashboard.js tests/compiler/fixtures/worthiness/dashboard.worthiness.json tests/compiler/fixtures/routing/no-score.routing.json tests/compiler/fixtures/grounding/no-score.grounded.json tests/compiler/generated/routed-no-score
      - name: Stage Claude Upload Skill package
        run: npm run package:claude-skill
      - uses: actions/upload-artifact@v4
        with:
          name: decision-first-dashboard-skill
          path: dist/claude-skill/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: saas-no-score-render
          path: |
            examples/saas/output.no-score.svg
            examples/saas/output.no-score.html
            examples/radar-profile/output.no-score.svg
            examples/radar-profile/output.no-score.html
            examples/saas/real-world/saasgrid/output.no-score.svg
            examples/saas/real-world/saasgrid/output.no-score.html
            tests/compiler/generated/v3-composite/output.composite.svg
            tests/compiler/generated/v3-composite/output.composite.html
            tests/compiler/generated/v3-no-score/output.no-score.svg
            tests/compiler/generated/v3-no-score/output.no-score.html
            tests/compiler/generated/routed-composite/output.composite.svg
            tests/compiler/generated/routed-composite/output.composite.html
            tests/compiler/generated/routed-no-score/output.no-score.svg
            tests/compiler/generated/routed-no-score/output.no-score.html
