name: Compiler tests

on:
  push:
    branches:
      - feature/dashboard-compiler-mvp
  pull_request:
    paths:
      - 'skills/decision-first-dashboard/**'
      - 'examples/saas/**'
      - 'tests/compiler/**'
      - 'package.json'
      - '.github/workflows/compiler-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
