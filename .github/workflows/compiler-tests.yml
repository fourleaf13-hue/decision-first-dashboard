name: Compiler tests

on:
  push:
    branches:
      - main
      - feature/dashboard-compiler-mvp
      - feature/composite-mode-compiler
  pull_request:
    paths:
      - 'skills/decision-first-dashboard/**'
      - 'examples/saas/**'
      - 'tests/compiler/**'
      - 'package.json'
      - '.github/workflows/compiler-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run validate:saas
      - run: npm run render:saas
      - name: Validate SaaSGrid real-world fixture
        run: node skills/decision-first-dashboard/scripts/validate.js examples/saas/real-world/saasgrid/input.no-score.json
      - name: Render SaaSGrid real-world fixture
        run: node skills/decision-first-dashboard/scripts/render.js examples/saas/real-world/saasgrid/input.no-score.json examples/saas/real-world/saasgrid
      - uses: actions/upload-artifact@v4
        with:
          name: saas-no-score-render
          path: |
            examples/saas/output.no-score.svg
            examples/saas/output.no-score.html
            examples/saas/real-world/saasgrid/output.no-score.svg
            examples/saas/real-world/saasgrid/output.no-score.html
      - name: Export exact main source
        run: git archive --format=zip --output=decision-first-dashboard-main-ff15e6e1.zip ff15e6e1e9c5d6e611d83c73204f3b97024e3751
      - uses: actions/upload-artifact@v4
        with:
          name: decision-first-dashboard-main-ff15e6e1
          path: decision-first-dashboard-main-ff15e6e1.zip
