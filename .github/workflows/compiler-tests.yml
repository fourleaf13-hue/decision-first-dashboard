name: Compiler tests

on:
  push:
    branches:
      - main
      - feature/dashboard-compiler-mvp
  pull_request:
    paths:
      - 'skills/decision-first-dashboard/**'
      - 'examples/saas/**'
      - 'tests/compiler/**'
      - 'package.json'
      - '.github/workflows/compiler-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run validate:saas
      - run: npm run render:saas
      - uses: actions/upload-artifact@v4
        with:
          name: saas-no-score-render
          path: |
            examples/saas/output.no-score.svg
            examples/saas/output.no-score.html
