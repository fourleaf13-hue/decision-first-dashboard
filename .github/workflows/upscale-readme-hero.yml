name: Upscale README hero

on:
  push:
    paths:
      - '.github/workflows/upscale-readme-hero.yml'

permissions:
  contents: write

jobs:
  upscale-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Upscale and sharpen hero
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          path = Path('assets/decision-first-dashboard-hero.png')
          image = Image.open(path).convert('RGB')
          image = image.resize((image.width * 2, image.height * 2), Image.Resampling.LANCZOS)
          image = image.filter(ImageFilter.UnsharpMask(radius=0.9, percent=135, threshold=2))
          image.save(path, format='PNG', optimize=True, compress_level=9)
          print(f'hero={image.width}x{image.height}')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/upscale-readme-hero.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Upscale README hero for sharper GitHub rendering'
          git push
