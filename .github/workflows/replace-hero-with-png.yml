name: Replace README hero with PNG

on:
  push:
    paths:
      - '.github/workflows/replace-hero-with-png.yml'

permissions:
  contents: write

jobs:
  replace-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Convert hero to sharpened PNG and update README
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          src = Path('assets/decision-first-dashboard-hero.jpg')
          dst = Path('assets/decision-first-dashboard-hero.png')

          image = Image.open(src).convert('RGB')
          image = image.filter(ImageFilter.UnsharpMask(radius=0.7, percent=170, threshold=1))
          image.save(dst, format='PNG', optimize=True, compress_level=9)

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('assets/decision-first-dashboard-hero.jpg', 'assets/decision-first-dashboard-hero.png')
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Remove old JPEG and temporary workflow
        run: |
          rm assets/decision-first-dashboard-hero.jpg
          rm .github/workflows/replace-hero-with-png.yml

      - name: Commit replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace README hero JPEG with sharpened PNG'
          git push
