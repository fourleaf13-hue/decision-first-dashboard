name: Finalize README hero WebP

on:
  push:
    paths:
      - '.github/workflows/finalize-hero-webp.yml'
      - '.tmp/hero/part-02.txt'

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref_name == 'fix/hero-webp-repair-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify hero
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/hero/part-0{0..9}.txt .tmp/herotail/tail-*.txt | base64 -d > assets/decision-first-dashboard-hero.webp
          test "$(stat -c%s assets/decision-first-dashboard-hero.webp)" -eq 83418
          echo "45973db0a72fdeb43e5d087297a76d648051ed1e44cd1fcf0cc055cb3098e08f  assets/decision-first-dashboard-hero.webp" | sha256sum -c -
          file assets/decision-first-dashboard-hero.webp | grep -qi 'Web/P'

      - name: Point README to verified WebP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = 'assets/decision-first-dashboard-hero.png'
          new = 'assets/decision-first-dashboard-hero.webp'
          if old not in s:
              raise SystemExit(f'Missing expected README image reference: {old}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Remove broken image and temporary upload files
        shell: bash
        run: |
          rm -f assets/decision-first-dashboard-hero.png
          rm -rf .tmp/hero .tmp/herotail
          rm -f .github/workflows/finalize-hero-webp.yml

      - name: Commit verified replacement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix README hero with verified WebP'
          git push origin HEAD:fix/hero-webp-repair-2
